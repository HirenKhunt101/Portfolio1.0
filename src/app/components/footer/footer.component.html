<footer class="footer">
    <div class="container">
        <div class="content">
            <div class="brand">
                <h3> {{ constants.portfolio.name }} {{ constants.portfolio.surname }}
                    <!-- <span>.</span> -->
                </h3>
                <p>Building digital experiences that matter.</p>
            </div>

            <div class="socials">
                <a href="{{constants.socials.GitHubUrl}}" target="_blank" aria-label="GitHub"><i
                        class="icon-github"></i> GitHub</a>
                <a href="{{constants.socials.LinkedInUrl}}" target="_blank" aria-label="LinkedIn"><i
                        class="icon-linkedin"></i> LinkedIn</a>
                <a href="{{constants.socials.TwitterUrl}}" target="_blank" aria-label="Twitter"><i
                        class="icon-twitter"></i> Twitter</a>
            </div>
        </div>

        <div class="copyright">
            <p>&copy; {{ currentYear }} All rights reserved.</p>
        </div>
    </div>
</footer>
