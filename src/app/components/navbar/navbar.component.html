<nav class="navbar" [class.glass]="true">
  <div class="container">
    <a routerLink="/" fragment="hero" class="logo">
      Portfolio<span class="dot">.</span>
    </a>

    <!-- Desktop Menu -->
    <div class="nav-links desktop-only">
      <a *ngFor="let link of links" 
         [routerLink]="link.path" 
         [fragment]="link.fragment" 
         routerLinkActive="active"
         [routerLinkActiveOptions]="{exact: true}">
        {{ link.label }}
      </a>
    </div>

    <div class="actions">
      <button (click)="toggleTheme()" class="theme-toggle" aria-label="Toggle Theme">
        <i class="icon-sun" *ngIf="!themeService.darkMode()">☀️</i>
        <i class="icon-moon" *ngIf="themeService.darkMode()">🌙</i>
      </button>

      <!-- Mobile Menu Toggle -->
      <button class="menu-toggle mobile-only" (click)="toggleMenu()">
        <span class="bar" [class.open]="isMenuOpen"></span>
        <span class="bar" [class.open]="isMenuOpen"></span>
        <span class="bar" [class.open]="isMenuOpen"></span>
      </button>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div class="mobile-menu" [class.open]="isMenuOpen">
    <a *ngFor="let link of links" 
       [routerLink]="link.path" 
       [fragment]="link.fragment"
       (click)="isMenuOpen = false">
      {{ link.label }}
    </a>
  </div>
</nav>
