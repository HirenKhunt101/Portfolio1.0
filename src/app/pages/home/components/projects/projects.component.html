<section class="section projects-section" id="projects">
    <div class="container">
        <app-section-title title="Featured Projects" subtitle="Some of my best work."></app-section-title>

        <div class="filter-controls">
            <button [class.active]="filter === 'all'" (click)="setFilter('all')">All</button>
            <button [class.active]="filter === 'frontend'" (click)="setFilter('frontend')">Frontend</button>
            <button [class.active]="filter === 'backend'" (click)="setFilter('backend')">Backend</button>
            <button [class.active]="filter === 'fullstack'" (click)="setFilter('fullstack')">Full Stack</button>
        </div>

        <div class="projects-grid" @staggerFadeInUp>
            <div class="project-card glass" *ngFor="let project of filteredProjects">
                <div class="card-image">
                    <!-- Placeholder background if image missing -->
                    <div class="placeholder-img">{{ project.title[0] }}</div>
                    <!-- <img [src]="project.image" [alt]="project.title" loading="lazy"> -->
                </div>
                <div class="card-content">
                    <h3>{{ project.title }}</h3>
                    <p>{{ project.description }}</p>
                    <div class="tags">
                        <span *ngFor="let tag of project.tags">{{ tag }}</span>
                    </div>
                    <div class="links">
                        <a *ngIf="project.demoUrl" [href]="project.demoUrl" target="_blank" class="link-btn">
                            <i class="icon-external-link"></i> Live Demo
                        </a>
                        <a *ngIf="project.githubUrl" [href]="project.githubUrl" target="_blank" class="link-icon">
                            <!-- <i class="icon-github"></i> --> GitHub
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
