<section class="section experience-section" id="experience">
    <div class="container">
        <app-section-title title="Experience & Education" subtitle="My professional track record."></app-section-title>

        <div class="timeline-container" @staggerFadeInUp>
            <!-- Work Experience -->
            <div class="column">
                <h3 class="column-title"><i class="icon-briefcase"></i> Work Experience</h3>
                <div class="timeline">
                    <div class="timeline-item" *ngFor="let job of constants.experience.workExperience">
                        <span class="year">{{ job.year }}</span>
                        <div class="content glass">
                            <h4>{{ job.role }}</h4>
                            <h5>{{ job.company }}</h5>
                            <p>{{ job.description }}</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Education -->
            <div class="column">
                <h3 class="column-title"><i class="icon-book"></i> Education</h3>
                <div class="timeline">
                    <div class="timeline-item" *ngFor="let edu of constants.experience.education">
                        <span class="year">{{ edu.year }}</span>
                        <div class="content glass">
                            <h4>{{ edu.degree }}</h4>
                            <h5>{{ edu.university }}</h5>
                            <p>{{ edu.description }}</p>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</section>
