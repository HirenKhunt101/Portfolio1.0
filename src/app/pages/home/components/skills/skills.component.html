<section class="section skills-section" id="skills">
    <div class="container">
        <app-section-title title="Skills & Tech" subtitle="My technical arsenal."></app-section-title>

        <div class="skills-grid" @staggerFadeInUp>
            <div class="skill-category glass" *ngFor="let category of skillCategories">
                <div class="category-header">
                    <!-- <i [class]="category.icon"></i> Icons later -->
                    <h3>{{ category.name }}</h3>
                </div>
                <div class="skill-tags">
                    <span class="tag" *ngFor="let skill of category.skills">{{ skill }}</span>
                </div>
            </div>
        </div>
    </div>
</section>
